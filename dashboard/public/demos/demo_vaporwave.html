<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo: vaporwave</title>
    <link rel="stylesheet" href="css/vaporwave.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&family=Inter:wght@400;600&family=Exo+2:wght@400;700&family=Press+Start+2P&family=Black+Ops+One&family=Comfortaa:wght@400;700&family=Roboto:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <aside class="sidebar panel">
            <h2 class="panel-header">ROSTER</h2>
            <div class="bot-list">
                <div class="bot-item selected"><span>Bot_1</span></div>
                <div class="bot-item"><span>Bot_2</span></div>
            </div>
        </aside>
        <main class="main-interface">
            <header class="top-bar panel">
                <h1>VAPORWAVE UI</h1>
                <div class="status-module online">ONLINE</div>
            </header>
            <section class="command-panel panel">
                <div class="control-section">
                    <h3>CONTROLS</h3>
                    <div class="input-row"><label>INPUT:</label><input type="text" placeholder="Start typing..."></div>
                    <button class="cyber-btn">ACTIVATE</button>
                    <button class="cyber-btn danger">ABORT</button>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
