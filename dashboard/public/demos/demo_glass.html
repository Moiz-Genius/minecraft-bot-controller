<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Demo: Glass OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.6);
            --border: rgba(255, 255, 255, 0.4);
        }

        body {
            margin: 0;
            background: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') center/cover no-repeat;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .desktop {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Floating Window */
        .window {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 70%;
            height: 70%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(0.95) translateY(20px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .title-bar {
            padding: 15px 20px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .traffic-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .red {
            background: #ff5f56;
        }

        .yellow {
            background: #ffbd2e;
        }

        .green {
            background: #27c93f;
        }

        .content {
            flex-grow: 1;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: rgba(255, 255, 255, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .nav-item.active {
            background: white;
            color: #007bff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .main-view {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .app-icon {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-icon:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        .icon-emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
        }

        /* Taskbar */
        .taskbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .dock-icon {
            width: 40px;
            height: 40px;
            background: #eee;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .dock-icon:hover {
            transform: scale(1.2) translateY(-10px);
            background: white;
        }
    </style>
</head>

<body>
    <div class="desktop">
        <div class="window">
            <div class="title-bar">
                <div class="traffic-light red"></div>
                <div class="traffic-light yellow"></div>
                <div class="traffic-light green"></div>
            </div>
            <div class="content">
                <nav class="sidebar">
                    <div class="nav-item active">Home</div>
                    <div class="nav-item">Bots</div>
                    <div class="nav-item">Terminal</div>
                    <div class="nav-item">Settings</div>
                </nav>
                <main class="main-view">
                    <h1>Active Units</h1>
                    <div class="grid">
                        <div class="app-icon"><span class="icon-emoji">🤖</span>Bot_1</div>
                        <div class="app-icon"><span class="icon-emoji">🤖</span>Bot_2</div>
                        <div class="app-icon"><span class="icon-emoji">🛡️</span>Guard</div>
                        <div class="app-icon"><span class="icon-emoji">⚔️</span>Attack</div>
                    </div>
                </main>
            </div>
        </div>

        <div class="taskbar">
            <div class="dock-icon">🏠</div>
            <div class="dock-icon">💬</div>
            <div class="dock-icon">⚙️</div>
        </div>
    </div>
</body>

</html>
