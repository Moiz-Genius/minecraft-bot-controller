<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Demo: Holographic Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(10, 20, 30, 0.75);
            --border: rgba(0, 255, 255, 0.3);
            --neon: #00f3ff;
        }

        body {
            margin: 0;
            background-color: #000;
            background-image: radial-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .desktop {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .window {
            position: absolute;
            top: 12%;
            left: 18%;
            width: 64%;
            height: 65%;
            background: var(--glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            display: flex;
            flex-direction: column;
            clip-path: polygon(0 0, 100% 0, 100% 95%, 98% 100%, 0 100%);
        }

        .window::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--neon);
            box-shadow: 0 0 10px var(--neon);
        }

        .title-bar {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            color: var(--neon);
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .controls span {
            display: inline-block;
            width: 20px;
            text-align: center;
            cursor: pointer;
        }

        .content {
            flex-grow: 1;
            display: flex;
        }

        .sidebar {
            width: 180px;
            border-right: 1px solid rgba(0, 243, 255, 0.1);
            padding: 15px;
        }

        .nav-item {
            padding: 10px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: 0.2s;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
            margin-bottom: 5px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon);
            padding-left: 20px;
            border-left: 2px solid var(--neon);
        }

        .main-view {
            flex-grow: 1;
            padding: 30px;
            color: white;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .holo-card {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            position: relative;
            transition: 0.3s;
        }

        .holo-card:hover {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.1);
        }

        .holo-card h3 {
            color: var(--neon);
            margin: 0 0 10px 0;
        }

        .dock {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            padding: 5px;
            border: 1px solid var(--border);
            background: var(--glass);
        }

        .dock-btn {
            width: 60px;
            height: 40px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid transparent;
            color: var(--neon);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .dock-btn:hover {
            background: var(--neon);
            color: black;
            box-shadow: 0 0 15px var(--neon);
        }

        .particle-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>

<body>
    <div class="desktop">
        <div class="window">
            <div class="title-bar">
                <span>NEXUS_INTERFACE // v9.0</span>
                <div class="controls"><span>_</span><span>[]</span><span>X</span></div>
            </div>
            <div class="content">
                <nav class="sidebar">
                    <div class="nav-item active">DASHBOARD</div>
                    <div class="nav-item">UNITS</div>
                    <div class="nav-item">MAP</div>
                    <div class="nav-item">LOGS</div>
                </nav>
                <main class="main-view">
                    <div class="card-grid">
                        <div class="holo-card">
                            <h3>Bot_1</h3>STATUS: ONLINE<br>HP: 100%
                        </div>
                        <div class="holo-card">
                            <h3>Bot_2</h3>STATUS: IDLE<br>HP: 92%
                        </div>
                        <div class="holo-card">
                            <h3>Bot_3</h3>STATUS: MINING<br>HP: 45%
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <div class="dock">
            <div class="dock-btn">HOME</div>
            <div class="dock-btn">CMD</div>
            <div class="dock-btn">SET</div>
        </div>
    </div>
</body>

</html>
