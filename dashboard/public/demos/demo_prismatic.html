<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Demo: Prismatic Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #050510;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated RGB Border Background */
        .rgb-card {
            position: relative;
            width: 800px;
            height: 500px;
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .rgb-card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 24px;
            z-index: -1;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: glowing 20s linear infinite;
        }

        @keyframes glowing {
            0% {
                background-position: 0 0;
            }

            50% {
                background-position: 100% 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        .header {
            padding: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            background: linear-gradient(to right, #00ffd5, #7a00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-area {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 200px 1fr;
        }

        .nav {
            padding: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn {
            padding: 12px;
            margin-bottom: 8px;
            color: #fff;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, rgba(122, 0, 255, 0.2), transparent);
            border-left: 3px solid #7a00ff;
        }

        .dashboard {
            padding: 30px;
            color: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .stat-box:hover::after {
            opacity: 1;
        }

        .stat-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }

        .big-number {
            font-size: 2.5rem;
            font-weight: 900;
        }

        .label {
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <div class="rgb-card">
        <header class="header">
            <div class="logo">Prism BIOS</div>
            <div style="color:white; font-size:0.8rem;">USER: MOIZHACKER</div>
        </header>
        <div class="main-area">
            <nav class="nav">
                <div class="nav-btn active">STATS</div>
                <div class="nav-btn">MODS</div>
                <div class="nav-btn">SYSTEM</div>
            </nav>
            <main class="dashboard">
                <div class="stat-box">
                    <div class="label">Framerate</div>
                    <div class="big-number glow-text" style="color: #00ffd5">144</div>
                    <div class="label">FPS</div>
                </div>
                <div class="stat-box">
                    <div class="label">Ping</div>
                    <div class="big-number glow-text" style="color: #ff00c8">12</div>
                    <div class="label">MS</div>
                </div>
                <div class="stat-box" style="grid-column: span 2">
                    <div class="label">Server Uptime</div>
                    <div class="big-number">03:41:12</div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
